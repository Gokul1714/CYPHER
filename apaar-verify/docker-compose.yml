version: '3.8'

services:
  # ==============================================================================
  # 1. PostgreSQL Database Service
  # ==============================================================================
  db:
    image: postgres:15-alpine
    container_name: cypher_postgres
    restart: always
    environment:
      POSTGRES_DB: cypher_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - cypher_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cypher_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ==============================================================================
  # 2. Spring Boot 3 Java Backend Service
  # ==============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cypher_backend
    restart: on-failure
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/cypher_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  # ==============================================================================
  # 3. React + Vite Frontend Client
  # ==============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cypher_frontend
    restart: on-failure
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=/api/v1
    depends_on:
      - backend

volumes:
  cypher_pgdata:
