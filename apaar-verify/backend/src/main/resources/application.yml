server:
  port: 8080

spring:
  application:
    name: apaar-verify
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/apaar_verify}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

# Security Configuration
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: 86400000 # 24 hours

# APAAR Gateway & Regulatory Platform Flags
app:
  verification:
    provider: MOCK_GATEWAY # Transparently labelled MOCK_GATEWAY until official NSDL/DigiLocker API integration
    token-validity-days: 365
  intake:
    alert-threshold-percent: 95.0
